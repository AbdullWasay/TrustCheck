[project]
name = "trustcheck-pk"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "pydantic[email]==2.10.4",
  "python-dotenv==1.0.1",
  "httpx==0.28.1",
  "email-validator==2.2.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
# Build React, then copy into ./dist for app.frontend("/", directory="dist")
build = "npm --prefix frontend install && npm --prefix frontend run build && rm -rf dist && cp -R frontend/dist dist"

[tool.vercel.fastapi.static]
# CORS middleware is present; force CDN promotion of the frontend build
cdn = true
